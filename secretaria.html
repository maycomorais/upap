<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de Secretaría | UPAP</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--upap:#8a171f}
body{background:#f1f5f7;font-family:'Segoe UI',Tahoma,sans-serif;font-size:.9rem}
.navbar{background:#313a46}
.card{border:0;box-shadow:0 0 35px rgba(154,161,171,.15)}
.badge-ok{background:#0acf97}.badge-no{background:#fa5c7c}.badge-wait{background:#ffbc00;color:#313a46}.badge-info{background:#39afd1}
.btn-upap{background:var(--upap);border-color:var(--upap);color:#fff}.btn-upap:hover{background:#6a1118;color:#fff}
.nav-pills .nav-link{color:#313a46}.nav-pills .nav-link.active{background:var(--upap);color:#fff}
tr[data-id]{cursor:pointer}
.stat i{font-size:1.8rem;color:var(--upap)}.stat .n{font-size:1.5rem;font-weight:600}
#toast{position:fixed;right:1rem;bottom:1rem;z-index:2000;max-width:90vw}
</style>
</head>
<body>
<nav class="navbar navbar-dark px-3 py-2">
  <span class="navbar-brand mb-0 h6">UPAP - Panel de Secretaría</span>
  <div class="d-flex align-items-center gap-3">
    <small class="text-white-50 d-none d-md-inline" id="who"></small>
    <button class="btn btn-light btn-sm" id="logout" aria-label="Cerrar sesión"><i class="mdi mdi-logout"></i><span class="d-none d-sm-inline"> Cerrar sesión</span></button>
  </div>
</nav>

<div class="container-fluid px-3 px-lg-4 mt-4 pb-5">
  <ul class="nav nav-pills mb-3 gap-1">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tabSol">Solicitudes <span class="badge bg-danger ms-1" id="cntPend">0</span></button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabAg">Agendamientos</button></li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="tabSol">
      <div class="row g-3 mb-3" id="stats"></div>
      <div class="card"><div class="card-body">
        <div class="row g-2 mb-3">
          <div class="col-6 col-md-3"><select id="fEstado" class="form-select form-select-sm">
            <option value="activas">Activas (pendientes y en proceso)</option><option value="">Todos los estados</option>
            <option>Pendiente</option><option>En proceso</option><option>Aprobada</option><option>Entregada</option><option>Rechazada</option></select></div>
          <div class="col-6 col-md-3"><select id="fDep" class="form-select form-select-sm"><option value="">Todas las dependencias</option>
            <option>Secretaría Académica</option><option>Coordinación de Carrera</option><option>Atención al Estudiante (ATE)</option><option>Cuenta Corriente</option></select></div>
          <div class="col-12 col-md-6"><input id="fQ" class="form-control form-control-sm" placeholder="Buscar por alumno, CI o tipo de solicitud"></div>
        </div>
        <div class="table-responsive"><table class="table table-hover align-middle mb-0">
          <thead><tr><th>N°</th><th>Fecha</th><th>Alumno</th><th>Solicitud</th><th>Dependencia</th><th>Estado</th></tr></thead>
          <tbody id="solBody"></tbody></table></div>
      </div></div>
    </div>

    <div class="tab-pane fade" id="tabAg">
      <div class="card"><div class="card-body">
        <div class="row g-2 mb-3">
          <div class="col-6 col-md-3"><select id="gEstado" class="form-select form-select-sm"><option value="">Todos los estados</option><option>Confirmado</option><option>Realizado</option><option>Ausente</option><option>Cancelado</option></select></div>
          <div class="col-6 col-md-3"><select id="gDep" class="form-select form-select-sm"><option value="">Todas las dependencias</option>
            <option>Secretaría Académica</option><option>Coordinación de Carrera</option><option>Atención al Estudiante (ATE)</option><option>Cuenta Corriente</option></select></div>
          <div class="col-6 col-md-3"><input type="date" id="gFecha" class="form-control form-control-sm"></div>
        </div>
        <div class="table-responsive"><table class="table table-hover align-middle mb-0">
          <thead><tr><th>Fecha</th><th>Hora</th><th>Alumno</th><th>Dependencia</th><th>Motivo</th><th>Estado</th></tr></thead>
          <tbody id="agBody"></tbody></table></div>
      </div></div>
    </div>
  </div>
</div>

<div class="modal fade" id="mModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-fullscreen-sm-down"><div class="modal-content">
  <div class="modal-header"><div><h5 class="modal-title" id="mTitle"></h5><small class="text-muted" id="mSub"></small></div><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
  <div class="modal-body">
    <div id="mInfo" class="mb-3" style="white-space:pre-line"></div>
    <label class="form-label" for="mEstado">Estado</label><select id="mEstado" class="form-select mb-3"></select>
    <label class="form-label" for="mResp">Respuesta o nota para el alumno</label><textarea id="mResp" rows="3" class="form-control" placeholder="Ej.: Tu constancia está lista para retirar en Secretaría."></textarea>
    <div id="mErr" class="mt-2"></div>
  </div>
  <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-upap" id="mSave">Guardar cambios</button></div>
</div></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const sb=window.supabase.createClient('https://udmogmypguwszgnxuyys.supabase.co','sb_publishable_nxP2KnttwCmuNIm0ObEqRQ_Q9zdy0a_');
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>d?d.slice(0,10).split('-').reverse().join('/'):'';
const ES={sol:['Pendiente','En proceso','Aprobada','Entregada','Rechazada'],ag:['Confirmado','Realizado','Ausente','Cancelado']};
const BS={Pendiente:'badge-wait','En proceso':'badge-info',Aprobada:'badge-ok',Entregada:'badge-ok',Rechazada:'badge-no',Confirmado:'badge-info',Realizado:'badge-ok',Ausente:'badge-no',Cancelado:'badge-no'};
let SOL=[],AG=[],cur=null;
const nro=x=>new Date(x.created_at).getFullYear()+'-'+String(x.id).padStart(4,'0');
const quien=x=>{const p=x.alumno||{};return `<b>${esc(p.nombre||'Sin nombre')}</b><small class="text-muted d-block">CI ${esc(p.ci||'-')}</small>`};
const badge=e=>`<span class="badge ${BS[e]||'badge-wait'}">${e}</span>`;

function toast(msg,err){
  const d=document.createElement('div');d.className='alert '+(err?'alert-danger':'alert-success')+' shadow py-2 mb-2';d.textContent=msg;
  $('toast').appendChild(d);setTimeout(()=>d.remove(),4500);
}
const showErr=e=>{console.error(e);toast('Error: '+(e.message||e),true)};

/* ---- Solicitudes ---- */
async function loadSol(){
  const {data,error}=await sb.from('solicitudes').select('*, alumno:profiles!solicitudes_alumno_id_fkey(nombre,ci)').order('created_at',{ascending:false});
  if(error)return showErr(error); SOL=data; renderSol();
}
function renderSol(){
  const c=e=>SOL.filter(x=>x.estado===e).length;
  const st=(i,n,l)=>`<div class="col-6 col-lg-3"><div class="card stat"><div class="card-body d-flex align-items-center gap-3"><i class="mdi ${i}"></i><div><div class="n">${n}</div><div class="text-muted small">${l}</div></div></div></div></div>`;
  $('stats').innerHTML=st('mdi-inbox-arrow-down',c('Pendiente'),'Pendientes')+st('mdi-progress-clock',c('En proceso'),'En proceso')+st('mdi-check-circle-outline',c('Aprobada')+c('Entregada'),'Resueltas')+st('mdi-close-circle-outline',c('Rechazada'),'Rechazadas');
  $('cntPend').textContent=c('Pendiente');
  const fe=$('fEstado').value,fd_=$('fDep').value,q=$('fQ').value.toLowerCase();
  const rows=SOL.filter(x=>(fe==='activas'?['Pendiente','En proceso'].includes(x.estado):!fe||x.estado===fe)&&(!fd_||x.dependencia===fd_)
    &&(!q||((x.alumno?.nombre||'')+' '+(x.alumno?.ci||'')+' '+x.tipo).toLowerCase().includes(q)));
  $('solBody').innerHTML=rows.map(x=>`<tr data-id="${x.id}" data-k="sol"><td>${nro(x)}</td><td>${fd(x.created_at)}</td><td>${quien(x)}</td>
    <td>${esc(x.tipo)}${x.materia?`<small class="text-muted d-block">${esc(x.materia)}</small>`:''}</td><td>${x.dependencia}</td><td>${badge(x.estado)}</td></tr>`).join('')
    ||'<tr><td colspan="6" class="text-center text-muted py-4">No hay solicitudes con estos filtros.</td></tr>';
}

/* ---- Agendamientos ---- */
async function loadAg(){
  const {data,error}=await sb.from('agendamientos').select('*, alumno:profiles!agendamientos_alumno_id_fkey(nombre,ci)').order('fecha',{ascending:false}).order('hora',{ascending:false});
  if(error)return showErr(error); AG=data; renderAg();
}
function renderAg(){
  const fe=$('gEstado').value,fdp=$('gDep').value,ff=$('gFecha').value;
  const rows=AG.filter(x=>(!fe||x.estado===fe)&&(!fdp||x.dependencia===fdp)&&(!ff||x.fecha===ff));
  $('agBody').innerHTML=rows.map(x=>`<tr data-id="${x.id}" data-k="ag"><td>${fd(x.fecha)}</td><td>${x.hora}</td><td>${quien(x)}</td>
    <td>${x.dependencia}<small class="text-muted d-block">${x.modalidad}</small></td><td>${esc(x.motivo)}</td><td>${badge(x.estado)}</td></tr>`).join('')
    ||'<tr><td colspan="6" class="text-center text-muted py-4">No hay agendamientos con estos filtros.</td></tr>';
}

/* ---- Gestionar (modal) ---- */
const modal=()=>bootstrap.Modal.getOrCreateInstance($('mModal'));
function open(k,id){
  const x=(k==='sol'?SOL:AG).find(r=>r.id===id); if(!x)return; cur={k,x};
  const p=x.alumno||{};
  $('mTitle').textContent=k==='sol'?x.tipo:`${x.dependencia} - ${fd(x.fecha)} ${x.hora}`;
  $('mSub').textContent=k==='sol'?`Solicitud N° ${nro(x)} - ${fd(x.created_at)}`:`${x.modalidad} - ${x.motivo}`;
  $('mInfo').textContent=`Alumno: ${p.nombre||'Sin nombre'} (CI ${p.ci||'-'})\nDependencia: ${x.dependencia}`+
    (k==='sol'?`\nPlazo estimado: ${x.plazo||'-'}${x.materia?'\nMateria: '+x.materia:''}`:`\nMotivo: ${x.motivo}`)+`\nObservación del alumno: ${x.obs||'Sin observaciones.'}`;
  $('mEstado').innerHTML=ES[k].map(e=>`<option${e===x.estado?' selected':''}>${e}</option>`).join('');
  $('mResp').value=x.respuesta||''; $('mErr').innerHTML=''; modal().show();
}
document.addEventListener('click',e=>{const r=e.target.closest('tr[data-id]');if(r)open(r.dataset.k,+r.dataset.id)});
$('mSave').onclick=async()=>{
  const est=$('mEstado').value,resp=$('mResp').value.trim();
  if(est==='Rechazada'&&!resp){$('mErr').innerHTML='<div class="alert alert-warning py-2 small">Indicá el motivo del rechazo en la respuesta para el alumno.</div>';return;}
  $('mSave').disabled=true;
  const {error}=await sb.from(cur.k==='sol'?'solicitudes':'agendamientos').update({estado:est,respuesta:resp||null}).eq('id',cur.x.id);
  $('mSave').disabled=false;
  if(error)return showErr(error);
  modal().hide(); toast('Cambios guardados. El alumno ya ve la actualización.'); cur.k==='sol'?loadSol():loadAg();
};

['fEstado','fDep'].forEach(i=>$(i).onchange=renderSol); $('fQ').oninput=renderSol;
['gEstado','gDep','gFecha'].forEach(i=>$(i).onchange=renderAg);
$('logout').onclick=async()=>{await sb.auth.signOut();location.replace('index.html')};

/* ---- Guard de sesión y rol ---- */
(async()=>{
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session)return location.replace('index.html');
    const {data:pf,error}=await sb.from('profiles').select('role').eq('id',session.user.id).single();
    if(error||!pf||pf.role!=='secretaria')return location.replace('index.html');
    $('who').textContent=session.user.email;
    loadSol();loadAg();
    sb.channel('secretaria')
      .on('postgres_changes',{event:'*',schema:'public',table:'solicitudes'},p=>{loadSol();if(p.eventType==='INSERT')toast('Llegó una nueva solicitud')})
      .on('postgres_changes',{event:'*',schema:'public',table:'agendamientos'},p=>{loadAg();if(p.eventType==='INSERT')toast('Nuevo agendamiento')}).subscribe();
  }catch(e){location.replace('index.html')}
})();
</script>
</body>
</html>
